# ---------------------------------------------------------------------------- #
# Tagger auxiliaries: train_words are actual training-loop evidence —
# distinguishes "does ML" from "imports torch".
# The scaffold default is torch-only, which would call ~90% of this corpus
# untrained: on a tabular board most fitting happens in a booster or an sklearn
# estimator, so the GBDT/sklearn fit vocabulary is added. All counts below are
# notebooks-containing, code cells only.
# ---------------------------------------------------------------------------- #
[tagger]
train_words = [
    # torch-style loops
    "backward", "optimizer", "zero_grad", "requires_grad",  # 46, 39, 42, 6 nb
    "criterion", "dataloader", "epoch", "epochs",           # 16, 19, 39, 44 nb
    # booster / sklearn fitting
    "fit",                        # 458 nb
    "lgb.train", "xgb.train",     # 44, 13 nb
    "num_boost_round",            # 48 nb
    "early_stopping_rounds",      # 138 nb
    "eval_set",                   # 197 nb
    "best_iteration",             # 72 nb
    "cross_val_score",            # 40 nb
    "predict_proba",              # 390 nb
]

# ---------------------------------------------------------------------------- #
# Archetypes: the primary approach labels, in display/priority order.
#   hard  — discriminating keywords precise enough to be trusted alone (the
#           tagger's precision tier; [lexicon] above is the recall tier).
#   color — cluster-map color; omit to auto-assign from a fixed palette.
# Structural labels (baseline/template, unknown, and the reference clone) are
# appended automatically — do not list them here.
#
# Order matters twice: it is the display order, and the generic scorer's ties
# resolve to whichever archetype is declared first. Most-strategy-signal first,
# so a notebook that reverse-engineers the generator AND trains an LGBM is
# filed under the former.
# ---------------------------------------------------------------------------- #

# The deepest read of this dataset: the generator emitted a small set of exact
# float values per column, so the value is a categorical key. Yields the
# Lookup-Transformer, value-level target encoding, and the max_bin arguments.
[[archetype]]
name = "generator-forensics"
hard = ["lookup", "exact value", "exact values", "max_bin", "frequency encoding"]
color = "#0072B2"

# Missingness engineered as signal — the competition's second real discovery
# (train and test differ in missingness rate in all twelve columns). Note the
# routine fillna/imputer vocabulary is deliberately NOT here: everyone imputes.
[[archetype]]
name = "missingness-signal"
hard = ["missingness", "missing_count", "n_missing", "missing_mask", "missing_rate"]
color = "#D55E00"

# Tabular deep learning: RealMLP, TabM, TabNet, residual MLPs, lookup
# transformers. `torch` itself is left out — it fires on notebooks that only
# import it; the import_tags map already records that.
[[archetype]]
name = "neural-tabular"
hard = ["realmlp", "tabm", "tabnet", "pytabkit", "nn.module", "bcewithlogitsloss"]
color = "#009E73"

# Fusing other people's published OOF/submission libraries rather than one's own
# models — the behavior that produced the 0.9712 plateau. Low frequency, high
# precision: these words essentially only occur when it is happening.
[[archetype]]
name = "public-oof-pool"
hard = ["oof library", "oof_library", "public oof", "decorrelated", "diversity"]
color = "#CC79A7"

# Rank-space / weight-space fusion with no meta-model: rankdata, weight search,
# hill climbing, Caruana selection.
[[archetype]]
name = "rank-blend-fusion"
hard = ["rankdata", "rank blend", "rank average", "blend weights", "hill climbing", "caruana"]
color = "#E69F00"

# Second-level model trained on the OOF matrix.
[[archetype]]
name = "oof-stacking"
hard = ["stacking", "stacker", "meta model", "meta_model", "oof_matrix", "base models"]
color = "#56B4E9"

# Measuring the measurement: adversarial validation, repeated/bootstrapped CV,
# seed-variance and ablation studies, public-vs-private survival analysis.
[[archetype]]
name = "validation-forensics"
hard = ["adversarial validation", "spearmanr", "auc_std", "ablation", "n_repeats",
        "repeatedstratifiedkfold"]
color = "#E5B300"

# Deriving features from the eight raw columns: target/frequency encoding,
# interactions, bins, splines.
[[archetype]]
name = "feature-engineering"
hard = ["target encoding", "targetencoder", "kbinsdiscretizer", "interaction", "spline",
        "smoothing"]

# Hand the search to a framework.
[[archetype]]
name = "automl"
hard = ["flaml", "autogluon", "h2o", "lazypredict", "keras_tuner"]

# Tuned-by-search, model family incidental.
[[archetype]]
name = "hpo-search"
hard = ["optuna", "create_study", "study.optimize", "n_trials", "gridsearchcv",
        "randomizedsearchcv"]

# The workhorse. Kept to four keys on purpose: `lightgbm` alone appears in 249
# of 579 notebooks, and a wider hard set here would structurally outbid every
# specialized archetype above.
[[archetype]]
name = "gbdt-modeling"
hard = ["lightgbm", "xgboost", "catboost", "num_leaves"]

# Explored but never fit. Ranked last so any notebook that also models wins on
# its modeling keys; EDA then survives as a secondary tag, which is the useful
# reading. `[tagger].train_words` is the independent check on "no training".
[[archetype]]
name = "eda-only"
hard = ["missingno", "pairplot", "violinplot", "crosstab", "countplot"]
