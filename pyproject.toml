[project]
name = "playground-series-s6e8"
version = "0.1.0"
description = "Kaggle Playground Series S6E8 — predicting smartphone addiction"
readme = "README.md"
authors = [
    { name = "Douglas Sgrott", email = "doug.sgrott@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle-wiki-kit",
    # data
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    # models
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    # 3.x wheels are built against CUDA 13; this WSL driver provides 12.9, so a
    # 3.x build silently falls back to CPU. See docs/issues/001.
    "xgboost>=2.1,<3.0",
    "catboost>=1.2",
    "torch>=2.5",
    # tuning / plotting / progress
    "optuna>=4.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "s6e8"

[tool.uv.sources]
kaggle-wiki-kit = { path = "../kaggle-wiki-kit", editable = true }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
